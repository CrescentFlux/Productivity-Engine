<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrescentFlux Digital Hub</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow-x: hidden; }

/* 背景层：两张照片交叉淡入 */
.bg-layer {
    position: fixed;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    z-index: -2;
}
.bg-layer.layer-1 {
    background-image: url('images/2026-9-25.jpg');
    animation: fadeA 24s ease-in-out infinite;
}
.bg-layer.layer-2 {
    background-image: url('images/2026-9-25-2.jpg');
    animation: fadeB 24s ease-in-out infinite;
}
@keyframes fadeA {
    0%, 40% { opacity: 1; }
    50%, 90% { opacity: 0; }
    100% { opacity: 1; }
}
@keyframes fadeB {
    0%, 40% { opacity: 0; }
    50%, 90% { opacity: 1; }
    100% { opacity: 0; }
}

body {
    background: #0a192f;
    color: #e6f1ff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.7;
    min-height: 100vh;
    padding: 20px;
}

/* 左右分栏 */
.split-layout {
    display: flex;
    width: 100%;
    min-height: calc(100vh - 40px);
    margin: 0 auto;
}

/* 左半：留白 */
.left-half {
    flex: 1;
}

/* 右半：内容区 */
.right-half {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    overflow-y: auto;
}

.content-box {
    width: 100%;
    padding: 40px;
}

h1 {
    font-size: 2rem;
    margin-bottom: 12px;
    background: linear-gradient(90deg, #64d9fe, #48bbff);
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    color: #a5b4cb;
    margin-bottom: 30px;
    font-size: 0.95rem;
}

.section-title {
    color: #64d9fe;
    border-bottom: 2px solid rgba(100, 217, 254, 0.3);
    padding-bottom: 10px;
    margin: 30px 0 20px;
    font-size: 1.2rem;
}

/* 主卡片网格 */
.card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 30px;
}

.card {
    background: rgba(20, 30, 50, 0.85);
    border: 1px solid rgba(100, 217, 254, 0.2);
    border-radius: 12px;
    padding: 18px;
    transition: all 0.3s;
}

.card:hover {
    background: rgba(30, 40, 60, 0.95);
    transform: translateY(-3px);
    border-color: rgba(100, 217, 254, 0.5);
}

.card h3 {
    color: #dbeafe;
    font-size: 1rem;
    margin-bottom: 8px;
    line-height: 1.4;
}

.card p {
    color: #a5b4cb;
    font-size: 0.82rem;
    margin-bottom: 12px;
    line-height: 1.5;
}

.card-links {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.card-links a {
    font-size: 0.78rem;
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(100, 217, 254, 0.1);
    border: 1px solid rgba(100, 217, 254, 0.3);
    color: #64d9fe;
    text-decoration: none;
    transition: all 0.2s;
}

.card-links a:hover {
    background: rgba(100, 217, 254, 0.25);
}

/* 边缘化项目：更小、更淡 */
.card.muted {
    background: rgba(20, 30, 50, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.08);
    padding: 14px;
}

.card.muted h3 {
    color: #8fa3bf;
    font-size: 0.9rem;
    margin-bottom: 4px;
}

.card.muted p {
    color: #6b7d99;
    font-size: 0.78rem;
    margin-bottom: 8px;
}

.card.muted .card-links a {
    color: #8fa3bf;
    border-color: rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.03);
}

.card.muted .card-links a:hover {
    background: rgba(255, 255, 255, 0.08);
}

.links-list {
    background: rgba(255, 255, 255, 0.05);
    padding: 18px;
    border-radius: 10px;
    border-left: 4px solid #64d9fe;
    list-style: none;
}

.links-list li {
    padding: 6px 0;
    color: #a5b4cb;
    font-size: 0.9rem;
}

.links-list a {
    color: #64d9fe;
    text-decoration: none;
}

.links-list a:hover {
    text-decoration: underline;
}

.top-fixer {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 5px;
    background: transparent;
    z-index: 9999;
}

@media (max-width: 900px) {
    .split-layout { flex-direction: column; }
    .left-half { display: none; }
    .right-half { width: 100%; }
    .content-box { padding: 25px; }
    h1 { font-size: 1.6rem; }
    .card-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
    <div class="bg-layer layer-1"></div>
    <div class="bg-layer layer-2"></div>
    <div class="top-fixer"></div>

    <div class="split-layout">
        <!-- 左半：留白 -->
        <div class="left-half"></div>

        <!-- 右半：卡片内容 -->
        <div class="right-half">
            <div class="content-box">
                <h1>My Digital Hub 我的数字空间</h1>
                <h2 class="section-title"> All Links 所有链接 </h2>
                <ul class="links-list">
                    <li><a href="https://github.com/CrescentFlux">GitHub 主页 →</a></li>
                </ul>
                <h2 class="section-title"> Projects 项目名称</h2>

                <div class="card-grid">
                    <div class="card">
                        <h3>Productivity 进阶</h3>
                        
                        <div class="card-links">
                            <a href="https://www.crescentflux.com">访问</a>
                            <a href="https://github.com/CrescentFlux/Productivity-Engine">GitHub</a>
                        </div>
                    </div>

                    <div class="card">
                        <h3>My Blog 我的博客</h3>
                       
                        <div class="card-links">
                            <a href="https://blog.crescentflux.com">访问</a>
                            <a href="https://github.com/CrescentFlux/Blog">GitHub</a>
                        </div>
                    </div>

                    <div class="card">
                        <h3>Tools 工具集</h3>
                        
                        <div class="card-links">
                            <a href="https://tools.crescentflux.com">访问</a>
                            <a href="https://github.com/CrescentFlux/tools">GitHub</a>
                        </div>
                    </div>

                   
                </div>

                
                
            </div>
        </div>
    </div>
</body>
</html>
